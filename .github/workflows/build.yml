name: Build 32-bit EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build 32-bit portable
        run: npm run build -- --win portable --ia32

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusModLauncher-ia32
          path: dist/*.exe
